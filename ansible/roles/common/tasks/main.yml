- name: Mise à jour du cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Paquets de base
  ansible.builtin.apt:
    name: [git, curl, vim, htop, gnupg, ca-certificates, apt-transport-https, net-tools, chrony]
    state: present

- name: Fuseau horaire (horodatage cohérent des journaux)
  community.general.timezone:
    name: "{{ lab_timezone }}"

- name: Résolution des noms du lab
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ hostvars[item].ansible_host }}\\s"
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
  loop: "{{ groups['all'] }}"
